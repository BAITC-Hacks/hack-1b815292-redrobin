<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedRobin · Анализ оргструктуры</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <div id="root"></div>
  <section class="server-fallback" aria-hidden="true">
    <p>Только обезличенные документы</p>
    <label>Редакция до <input id="before-file" name="before_file" type="file"></label>
    <button id="swap-files" type="button">Поменять редакции местами</button>
    <label>Редакция после <input id="after-file" name="after_file" type="file"></label>
  </section>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>
