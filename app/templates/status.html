<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RedRobin · Анализ</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  <main class="shell status-shell" data-status-page data-job-id="{{ job_id }}">
    <a class="brand" href="/">Red<span>Robin</span></a>
    <section class="status-panel" aria-live="polite">
      <div class="pulse-mark" aria-hidden="true"><span></span></div>
      <p class="eyebrow">Задание {{ job_id[:8] }}</p>
      <h1 id="status-title">Извлекаем разделы и пункты</h1>
      <p id="status-description">Документы уже сохранены. Не закрывайте эту страницу, результат откроется автоматически.</p>
      <div class="progress-track" aria-label="Прогресс анализа">
        <span id="progress-bar" style="width: 5%"></span>
      </div>
      <div class="progress-meta">
        <span id="stage-label">extracting</span>
        <strong id="progress-value">5%</strong>
      </div>

      <ol class="stage-list">
        <li data-stage-item="extracting" class="active"><span>1</span>Извлечение пунктов</li>
        <li data-stage-item="analyzing"><span>2</span>Сопоставление и классификация</li>
        <li data-stage-item="verifying"><span>3</span>Проверка источников</li>
      </ol>

      <div class="status-error" id="status-error" hidden>
        <strong>Анализ не завершён</strong>
        <p id="status-error-message"></p>
        <button class="primary-button compact" id="retry-analysis" type="button">Повторить</button>
        <a href="/">Загрузить файлы заново</a>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>
